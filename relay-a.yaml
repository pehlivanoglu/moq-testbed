relay_id: relay-a
listeners:
  - name: main
    udp:
      socket: { address: "::", port: 9668 }
    tls: { insecure: true }
    endpoint: "/moq-relay"
services:
  default:
    match:
      - authority: { any: true }
        path: { prefix: "/" }
    cache: { enabled: false, max_tracks: 100, max_groups_per_track: 3 }
admin:
  port: 9669
  address: "::"
  plaintext: true