topology_mode: explicit
relays:
  relay:
    edge: true
    sbd:
      enabled: true
      algorithm: PracticalPassiveAndRFC
      delay_source: owd
    listen_port: 9668
    admin_port: 9669
    upstream: null
    image: moqlab-relay
    endpoint: /moq-relay
    l4s_ce_target: 0.05
    tls:
      insecure: false
      generated: true
    cache:
      enabled: false
      max_tracks: 100
      max_groups_per_track: 3
publishers:
  pub:
    kind: media
    connects_to: relay
    asset: testsvc
    listen_port: 4443
    fingerprint_port: 8081
    image: moqlab-media-pub
subscribers:
  sub-r:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
  sub-1:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
  sub:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
  sub-2:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
  sub-3:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
  sub-4:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
routers:
  router:
    image: moqlab-router
    aqm: dualpi2
    dualpi2_target_ms: 15
  router-1:
    image: moqlab-router
    aqm: dualpi2
    dualpi2_target_ms: 15
  router-2:
    image: moqlab-router
    aqm: dualpi2
    dualpi2_target_ms: 15
switches:
  switch:
    image: moqlab-router
  switch-1:
    image: moqlab-router
  switch-2:
    image: moqlab-router
links:
- from: relay
  to: pub
- from: relay
  to: router
- from: router
  to: switch
  forward:
    bandwidth_mbps: 10000
- from: switch
  to: sub-r
  forward:
    delay_ms: 0
    jitter_ms: 0
    loss_pct: 0
  reverse:
    delay_ms: 0
    jitter_ms: 0
    loss_pct: 0
- from: switch
  to: sub-1
  forward:
    delay_ms: 0
    jitter_ms: 0
    loss_pct: 0
  reverse:
    delay_ms: 0
    jitter_ms: 0
    loss_pct: 0
- from: switch
  to: sub
  forward:
    delay_ms: 0
    jitter_ms: 0
    loss_pct: 0
  reverse:
    delay_ms: 0
    jitter_ms: 0
    loss_pct: 0
- from: relay
  to: router-1
- from: router-1
  to: switch-1
- from: switch-1
  to: sub-2
- from: relay
  to: router-2
- from: router-2
  to: switch-2
- from: sub-3
  to: switch-2
- from: switch-2
  to: sub-4
defaults:
  relay:
    image: moqlab-relay
    endpoint: /moq-relay
    tls:
      insecure: false
      generated: true
    cache:
      enabled: false
      max_tracks: 100
      max_groups_per_track: 3
  publisher:
    image: moqlab-media-pub
  subscriber:
    image: moqlab-media-sub
    native_media_image: moqlab-media-native-sub
    media_client: chrome-headless
    native_playback: receive
    log_level: INFO
  router:
    image: moqlab-router
  traffic:
    image: moqlab-traffic
    tcp_port: 9000
    udp_port: 9001
  link:
    forward: {}
    reverse: {}
startup:
  relay_warmup_s: 2
  publisher_warmup_s: 1
  media_ready_timeout_s: 30
  traffic_ready_timeout_s: 5
