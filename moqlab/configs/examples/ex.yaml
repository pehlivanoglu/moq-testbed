topology_mode: explicit
relays:
  relay:
    listen_port: 9668
    admin_port: 9669
    upstream: null
    image: moqlab-relay
    endpoint: /moq-relay
    tls:
      insecure: false
      generated: true
    cache:
      enabled: false
      max_tracks: 100
      max_groups_per_track: 3
publishers:
  pub:
    kind: media
    connects_to: relay
    asset: testsvc
    listen_port: 4443
    fingerprint_port: 8081
    image: moqlab-media-pub
subscribers:
  sub:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-sub
    log_level: INFO
    media_client: chrome-headless
    minimal_buffer_ms: 200
    target_latency_ms: 300
routers: {}
links: []
defaults:
  relay:
    image: moqlab-relay
    endpoint: /moq-relay
    tls:
      insecure: false
      generated: true
    cache:
      enabled: false
      max_tracks: 100
      max_groups_per_track: 3
  publisher:
    image: moqlab-media-pub
  subscriber:
    image: moqlab-media-sub
    native_media_image: moqlab-media-native-sub
    media_client: chrome-headless
    native_playback: receive
    log_level: INFO
  router:
    image: moqlab-router
  traffic:
    image: moqlab-traffic
    tcp_port: 9000
    udp_port: 9001
  link:
    forward: {}
    reverse: {}
startup:
  relay_warmup_s: 2
  publisher_warmup_s: 1
  media_ready_timeout_s: 30
  traffic_ready_timeout_s: 5