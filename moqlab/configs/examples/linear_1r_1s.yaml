# One-relay topology with one publisher, one subscriber, and one router.
#
#   pub  ───►  relay-a  ───  rt-1  ───  sub
#
# pub serves an AV1-SVC stream through relay-a; sub subscribes to it through
# relay-a. rt-1 is an IP router container that owns the bottleneck queue on
# the last mile: its egress toward sub runs a 20 Mbps HTB with a dualpi2
# (L4S) AQM.
#
# Bring it up:
#   moqlab run -c moqlab/configs/examples/linear_1r_1s.yaml --backend containernet
#
# `routers:` + `links:` describe physical wiring and are Containernet-only.
# The Docker backend refuses topologies with routers.

topology_mode: explicit

defaults:
  relay:
    image: moqlab-relay
    endpoint: /moq-relay
    tls: { insecure: false, generated: true }
    cache: { enabled: false, max_tracks: 100, max_groups_per_track: 3 }
  publisher:
    image: moqlab-media-pub
  subscriber:
    image: moqlab-media-sub
    log_level: INFO
  router:
    image: moqlab-router

startup:
  relay_warmup_s: 2.0
  publisher_warmup_s: 1.0
  media_ready_timeout_s: 30

relays:
  relay-a:
    listen_port: 9668
    admin_port: 9669
    upstream: null      # origin

publishers:
  pub:
    connects_to: relay-a
    asset: testsvc
    listen_port: 4443
    fingerprint_port: 8081

subscribers:
  sub:
    connects_to: relay-a
    namespace: msf/clear
    track: video/s2

routers:
  rt-1: {}              # image defaults to moqlab-router

# Per-direction shaping: `forward` is the egress qdisc on the `from` side,
# `reverse` the egress qdisc on the `to` side. `aqm` is only valid where the
# egress node is a router.
links:
  - from: pub
    to: relay-a
    forward: { bandwidth_mbps: 100, delay_ms: 5 }
    reverse: { delay_ms: 5 }
  - from: relay-a
    to: rt-1
    forward: { delay_ms: 1 }
    reverse: { delay_ms: 1 }
  - from: rt-1
    to: sub
    forward: { bandwidth_mbps: 20, aqm: dualpi2 }   # bottleneck: router egress
    reverse: { delay_ms: 1 }
