# One-relay linear topology with one publisher and one subscriber.
#
#   pub  ───►  relay-a  ◄───  sub
#
# pub publishes the date stream into relay-a; sub subscribes to it through
# relay-a.
#
# Bring it up on either backend:
#   moqlab run -c moqlab/configs/examples/linear_1r_1s.yaml --backend docker
#   moqlab run -c moqlab/configs/examples/linear_1r_1s.yaml --backend containernet
#
# The `links:` block is read only by the Containernet backend.

topology_mode: explicit

defaults:
  relay:
    image: moqlab-relay
    endpoint: /moq-relay
    tls: { insecure: true }
    cache: { enabled: false, max_tracks: 100, max_groups_per_track: 3 }
  publisher:
    image: moqlab-pub
    insecure: true
    log_level: INFO
  subscriber:
    image: moqlab-sub
    insecure: true
    log_level: INFO

startup:
  relay_warmup_s: 2.0
  publisher_warmup_s: 1.0

relays:
  relay-a:
    listen_port: 9668
    admin_port: 9669
    upstream: null      # origin

publishers:
  pub:
    connects_to: relay-a
    namespace: moq-date

subscribers:
  sub:
    connects_to: relay-a
    namespace: moq-date
    track: date

# Optional per-link shaping (Containernet backend only; Docker backend ignores).
links:
  - { from: pub,     to: relay-a, bandwidth_mbps: 100, delay_ms: 5 }
  - { from: relay-a, to: sub,     bandwidth_mbps: 20,  delay_ms: 1 }
