# Three-relay tree behind one core router, with four subscribers.
#
#                       ┌── relay-2 ◄── sub-1, sub-2
#   pub ──► relay-1 ── rt-core
#                       └── relay-3 ◄── sub-3, sub-4
#
# pub publishes the date stream into relay-1; relay-2 and relay-3 use relay-1
# as their upstream and reach it through rt-core, a multi-interface IP router
# container. rt-core owns the fan-out bottlenecks: its egress toward each
# leaf relay runs a 50 Mbps HTB with a dualpi2 (L4S) AQM.
#
# Bring it up:
#   moqlab run -c moqlab/configs/examples/tree_3r_4s.yaml --backend containernet
#
# `routers:` + `links:` describe physical wiring and are Containernet-only.
# The Docker backend refuses topologies with routers.

topology_mode: explicit

defaults:
  relay:
    image: moqlab-relay
    endpoint: /moq-relay
    tls: { insecure: true }
    cache: { enabled: false, max_tracks: 100, max_groups_per_track: 3 }
  publisher:
    image: moqlab-pub
    insecure: true
    log_level: INFO
  subscriber:
    image: moqlab-sub
    insecure: true
    log_level: INFO
  router:
    image: moqlab-router
  # Every link inherits these per-direction; entries below state only what
  # differs. Fields merge one at a time, so a link that sets `bandwidth_mbps`
  # keeps the inherited `delay_ms`.
  link:
    forward: { delay_ms: 1 }
    reverse: { delay_ms: 1 }

startup:
  relay_warmup_s: 2.0
  publisher_warmup_s: 1.0

relays:
  relay-1:
    listen_port: 9668
    admin_port: 9669
    upstream: null      # origin

  relay-2:
    listen_port: 9670
    admin_port: 9671
    upstream: relay-1

  relay-3:
    listen_port: 9672
    admin_port: 9673
    upstream: relay-1

publishers:
  pub:
    connects_to: relay-1
    namespace: moq-date

subscribers:
  sub-1:
    connects_to: relay-2
    namespace: moq-date
    track: date

  sub-2:
    connects_to: relay-2
    namespace: moq-date
    track: date

  sub-3:
    connects_to: relay-3
    namespace: moq-date
    track: date

  sub-4:
    connects_to: relay-3
    namespace: moq-date
    track: date

routers:
  rt-core: {}

# Per-direction shaping: `forward` is the egress qdisc on the `from` side,
# `reverse` the egress qdisc on the `to` side. `aqm` is only valid where the
# egress node is a router. Unstated fields come from `defaults.link` above.
links:
  - from: pub
    to: relay-1
    forward: { bandwidth_mbps: 100 }

  - from: relay-1
    to: rt-core

  # Fan-out bottlenecks. `delay_ms: null` clears the inherited 1ms so the chain
  # stays htb -> dualpi2 with no netem in between: netem would sit upstream of
  # the AQM on the same interface, and dualpi2 would measure sojourn times
  # through the delay line and mark on the wrong signal. Path delay belongs on
  # the endpoint links. `null` (not 0) is what removes the qdisc — `delay_ms: 0`
  # is still a delay and would insert `netem delay 0ms`.
  - from: rt-core
    to: relay-2
    forward: { bandwidth_mbps: 50, delay_ms: null, aqm: dualpi2 }

  - from: rt-core
    to: relay-3
    forward: { bandwidth_mbps: 50, delay_ms: null, aqm: dualpi2 }

  - from: relay-2
    to: sub-1
    forward: { bandwidth_mbps: 20 }

  - from: relay-2
    to: sub-2
    forward: { bandwidth_mbps: 20 }

  - from: relay-3
    to: sub-3
    forward: { bandwidth_mbps: 20 }

  - from: relay-3
    to: sub-4
    forward: { bandwidth_mbps: 20 }
