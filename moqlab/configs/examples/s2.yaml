topology_mode: explicit
relays:
  relay:
    edge: true
    sbd:
      enabled: true
      delay_source: owd
    listen_port: 9668
    admin_port: 9669
    upstream: null
    image: moqlab-relay
    endpoint: /moq-relay
    tls:
      insecure: false
      generated: true
    cache:
      enabled: false
      max_tracks: 100
      max_groups_per_track: 3
publishers:
  pub:
    kind: media
    connects_to: relay
    asset: testsvc
    listen_port: 4443
    fingerprint_port: 8081
    image: moqlab-media-pub
subscribers:
  sub:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
  sub-1:
    kind: media
    connects_to: relay
    namespace: msf/clear
    track: video/s2
    image: moqlab-media-native-sub
    log_level: INFO
    media_client: native
    native_playback: receive
routers:
  router:
    image: moqlab-router
switches:
  switch:
    image: moqlab-router
links:
- from: pub
  to: relay
- from: router
  to: switch
  forward:
    bandwidth_mbps: 30
  reverse:
    bandwidth_mbps: 100
    delay_ms: 3
- from: switch
  to: sub-1
  forward:
    bandwidth_mbps: 15
- from: switch
  to: sub
  forward:
    bandwidth_mbps: 15
- from: relay
  to: router
defaults:
  relay:
    image: moqlab-relay
    endpoint: /moq-relay
    tls:
      insecure: false
      generated: true
    cache:
      enabled: false
      max_tracks: 100
      max_groups_per_track: 3
  publisher:
    image: moqlab-media-pub
  subscriber:
    image: moqlab-media-sub
    native_media_image: moqlab-media-native-sub
    media_client: chrome-headless
    native_playback: receive
    log_level: INFO
  router:
    image: moqlab-router
  traffic:
    image: moqlab-traffic
    tcp_port: 9000
    udp_port: 9001
  link:
    forward: {}
    reverse: {}
startup:
  relay_warmup_s: 2
  publisher_warmup_s: 1
  media_ready_timeout_s: 30
  traffic_ready_timeout_s: 5
