topology_mode: explicit
defaults:
  subscriber:
    media_client: native
    native_playback: receive
relays:
  relay-a: { listen_port: 9668, admin_port: 9669, upstream: null }
  relay-b: { listen_port: 9670, admin_port: 9671, upstream: relay-a }
  relay-c: { listen_port: 9672, admin_port: 9673, upstream: relay-b }
publishers:
  pub: { connects_to: relay-a, asset: testsvc }
subscribers:
  sub: { connects_to: relay-c, namespace: msf/clear, track: video/s2 }
routers:
  rt-ab: { aqm: dualpi2 }
  rt-bc: { aqm: dualpi2 }
links:
  - { from: pub, to: relay-a }
  - { from: relay-a, to: rt-ab }
  - from: rt-ab
    to: relay-b
    forward: { bandwidth_mbps: 50 }
  - { from: relay-b, to: rt-bc }
  - from: rt-bc
    to: relay-c
    forward: { bandwidth_mbps: 50 }
  - { from: relay-c, to: sub }
