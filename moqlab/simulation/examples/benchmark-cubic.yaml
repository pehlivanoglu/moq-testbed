kind: simulation
schema_version: 1
topology:
  topology_mode: explicit
  defaults:
    relay:
      image: moqlab-relay
      endpoint: /moq-relay
      tls:
        insecure: false
        generated: true
        cert_file: null
        key_file: null
        ca_cert: null
      cache:
        enabled: false
        max_tracks: 100
        max_groups_per_track: 3
    publisher:
      image: moqlab-media-pub
    subscriber:
      image: moqlab-media-sub
      native_media_image: moqlab-media-native-sub
      media_client: chrome-headless
      native_playback: receive
      log_level: INFO
    router:
      image: moqlab-router
    traffic:
      image: moqlab-traffic
      tcp_port: 9000
      udp_port: 9001
    link:
      forward:
        bandwidth_mbps: null
        delay_ms: null
        jitter_ms: null
        loss_pct: null
      reverse:
        bandwidth_mbps: null
        delay_ms: null
        jitter_ms: null
        loss_pct: null
  startup:
    relay_warmup_s: 2.0
    publisher_warmup_s: 1.0
    media_ready_timeout_s: 30.0
    traffic_ready_timeout_s: 5.0
  relays:
    server:
      edge: true
      sbd:
        enabled: true
        algorithm: PracticalPassiveAndRFC
        delay_source: owd
      listen_port: 9668
      admin_port: 9669
      upstream: null
      image: null
      endpoint: null
      tls: null
      cache: null
      l4s_ce_target: null
  publishers:
    origin:
      kind: media
      connects_to: server
      asset: synthetic
      listen_port: 4443
      fingerprint_port: 8081
      image: null
  subscribers:
    client-000:
      kind: media
      connects_to: server
      namespace: synthetic
      track: bytes
      image: null
      log_level: null
      media_client: null
      rtt_metrics: false
      minimal_buffer_ms: 200
      target_latency_ms: 300
