relay_id: relay-b
listeners:
  - name: main
    udp:
      socket: { address: "::", port: 9670 }
    tls: { insecure: true }
    endpoint: "/moq-relay"
services:
  default:
    match:
      - authority: { any: true }
        path: { prefix: "/" }
    cache: { enabled: false, max_tracks: 100, max_groups_per_track: 3 }
    upstream:
      url: "moqt://localhost:9668/moq-relay"
      tls: { insecure: true }
admin:
  port: 9671
  address: "::"
  plaintext: true